<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <!-- Outer Gold Ring Gradients -->
    <linearGradient id="goldRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a7424"/>
      <stop offset="18%" stop-color="#e3be64"/>
      <stop offset="45%" stop-color="#fff4b8"/>
      <stop offset="55%" stop-color="#cf9c2e"/>
      <stop offset="85%" stop-color="#7a5512"/>
      <stop offset="100%" stop-color="#caa247"/>
    </linearGradient>
    <linearGradient id="goldInnerRim" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8a631c"/>
      <stop offset="30%" stop-color="#dfb655"/>
      <stop offset="50%" stop-color="#fff9cf"/>
      <stop offset="70%" stop-color="#d4a337"/>
      <stop offset="100%" stop-color="#916a20"/>
    </linearGradient>
    
    <!-- Pearl Disc Background -->
    <radialGradient id="pearlDisc" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f5f6f8"/>
      <stop offset="75%" stop-color="#e1e4ea"/>
      <stop offset="100%" stop-color="#c8cdd7"/>
    </radialGradient>
    
    <!-- Glass Arc Highlight -->
    <linearGradient id="glassReflection" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Green Wing Gradient -->
    <linearGradient id="greenWingGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B04F"/>
    </linearGradient>
    
    <!-- Gold Accent Line -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cf9c2e"/>
      <stop offset="50%" stop-color="#fff4b8"/>
      <stop offset="100%" stop-color="#cf9c2e"/>
    </linearGradient>
  </defs>

  <!-- Outer Gold Rim -->
  <circle cx="250" cy="250" r="198" fill="url(#goldRimGrad)"/>
  
  <!-- Outer Gold Shadow / Groove -->
  <circle cx="250" cy="250" r="178" fill="none" stroke="#68470e" stroke-width="2" opacity="0.6"/>
  
  <!-- Inner Gold Bevel Ring -->
  <circle cx="250" cy="250" r="172" fill="url(#goldInnerRim)"/>
  <circle cx="250" cy="250" r="162" fill="none" stroke="#dfb655" stroke-width="3"/>
  <circle cx="250" cy="250" r="158" fill="none" stroke="#61410b" stroke-width="1.5" opacity="0.5"/>
  <circle cx="250" cy="250" r="154" fill="url(#goldAccent)" stroke="none"/>

  <!-- Pearl Disc Center -->
  <circle cx="250" cy="250" r="150" fill="url(#pearlDisc)"/>

  <!-- Subtle Pearl Glass Sheen Overlay -->
  <path d="M140 210 C160 140, 260 120, 340 150 C370 162, 390 190, 395 220 C380 160, 300 135, 230 145 C175 152, 148 180, 140 210 Z" fill="url(#glassReflection)"/>

  <!-- BlackPerl Bird / Emblem Artwork (substantially larger, positioned toward the left) -->
  <g transform="translate(234, 188) scale(1.24)">
    <!-- Horns / Brow: Swooping curved crest with sharp outer horns and center beak -->
    <path d="M -54 -38 C -48 -20, -32 -10, -18 -8 C -8 -7, -3 -1, 0 4 C 3 -1, 8 -7, 18 -8 C 32 -10, 48 -20, 54 -38 C 42 -22, 26 -16, 12 -16 C 5 -16, 0 -13, 0 -13 C 0 -13, -5 -16, -12 -16 C -26 -16, -42 -22, -54 -38 Z" fill="#0d1117"/>
    
    <!-- Owl Eyes -->
    <circle cx="-25" cy="-7" r="4.5" fill="#0d1117"/>
    <circle cx="25" cy="-7" r="4.5" fill="#0d1117"/>
    
    <!-- Left Wing / Body: Charcoal / Black sleek shield segment -->
    <path d="M -44 0 L -8 0 C -12 18, -18 36, -26 54 L -44 54 Z" fill="#1e2229"/>
    
    <!-- Right Wing / Swoosh: Radiant Emerald Green curved swoop -->
    <path d="M -2 0 C 8 2, 28 8, 38 22 C 45 32, 42 48, 32 58 C 22 68, 5 76, -12 88 C -26 98, -36 108, -44 116 C -40 102, -32 86, -20 70 C -6 52, 14 42, 18 30 C 22 20, 14 10, -2 0 Z" fill="url(#greenWingGrad)"/>
  </g>

  <!-- Official BlackPerl Wordmark Artwork clearly visible inside emblem -->
  <text x="250" y="350" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#000000" letter-spacing="-0.5px">BlackPerl</text>
</svg>
